# Externally-called endpoints: the payment gateway / Razorpay POST here with no
# Supabase JWT, so the gateway must not enforce one. These functions are
# responsible for verifying their own request authenticity (secureHash /
# webhook signature) since they are publicly reachable.
[functions.payment-callback]
verify_jwt = false

[functions.reschedule-payment-callback]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false